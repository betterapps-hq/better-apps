name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      # Beachball's change check compares a pull request with origin/main, so it needs the whole history.
      fetch-depth: 0
      command: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          pnpm check:change
        fi
        pnpm verify
  # Branch protection requires a check named verify, and a reusable workflow's checks are named after the calling job,
  # such as "ci-verify / Verify (ubuntu-latest)". This job reports ci-verify's result as verify.
  verify:
    needs: ci-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ci-verify to pass
        env:
          RESULT: ${{ needs.ci-verify.result }}
        run: test "$RESULT" = success
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@main
      - name: Test the Drizzle adapter on PostgreSQL, Neon and MySQL servers
        run:
          pnpm exec vp run --cache --filter "@better-apps/database-drizzle^..." build && pnpm --filter
          @better-apps/database-drizzle test:servers
  # Releases what main's change files describe, once main passes: Beachball bumps the versions and changelogs, publishes
  # the new versions to npm, then commits them and pushes the commit and its tags to main. The push uses the deploy key in
  # the npm environment's RELEASE_DEPLOY_KEY secret, the one actor main's ruleset lets skip a pull request. Its push
  # starts CI again, which finds no change files and releases nothing. npm's trusted publishing names this file and the
  # npm environment, so no npm token is stored, and provenance is signed with the run's OIDC token.
  release:
    needs: [verify, databases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check for the deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::Add the RELEASE_DEPLOY_KEY secret to the npm environment to release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - if: steps.key.outputs.ready == 'true'
        uses: betterapps-hq/pipelines/github/actions/setup@main
        with:
          checkout: false
      - if: steps.key.outputs.ready == 'true'
        name: Bump, publish and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm build:packages
          pnpm exec beachball publish --yes --message "chore(release): publish packages"
