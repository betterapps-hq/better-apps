name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      # Beachball's change check compares a pull request with origin/main, so it needs the whole history.
      fetch-depth: 0
      command: |
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          pnpm check:change
        fi
        pnpm verify
  # Branch protection requires a check named verify, and a reusable workflow's checks are named after the calling job,
  # such as "ci-verify / Verify (ubuntu-latest)". This job reports ci-verify's result as verify.
  verify:
    needs: ci-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ci-verify to pass
        env:
          RESULT: ${{ needs.ci-verify.result }}
        run: test "$RESULT" = success
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@main
      - name: Test the Drizzle adapter on PostgreSQL, Neon and MySQL servers
        run:
          pnpm exec vp run --cache --filter "@better-apps/database-drizzle^..." build && pnpm --filter
          @better-apps/database-drizzle test:servers
  # Releases main's change files once main passes, through the shared beachball-publish-npm template: Beachball bumps
  # the versions and changelogs, publishes the new versions through npm trusted publishing, then commits, tags and
  # pushes them to main with the npm environment's RELEASE_DEPLOY_KEY, the one actor main's ruleset lets skip a pull
  # request. npm's trusted publishers name this file and the npm environment.
  release:
    needs: [verify, databases]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: betterapps-hq/pipelines/.github/workflows/beachball-publish-npm.yml@main
    # The template reads RELEASE_DEPLOY_KEY from the npm environment, which a called workflow sees only when the caller
    # inherits secrets.
    secrets: inherit
    with:
      build-command: pnpm build:packages
