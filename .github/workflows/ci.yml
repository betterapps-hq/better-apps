name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@cfe6a66143f19e96a69eb54ee703ec3d052d37a7 # v1.10.0
    with:
      command: pnpm verify
  # Branch protection expects a check named verify, and a reusable workflow's checks are named after the calling job,
  # such as "ci-verify / Verify (ubuntu-latest)". This job reports ci-verify's result as verify.
  verify:
    needs: ci-verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ci-verify to pass
        env:
          RESULT: ${{ needs.ci-verify.result }}
        run: test "$RESULT" = success
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@8b4311a69b28ad7423898dceda366cee6644f92c # v1.1.1
      - name: Test the Drizzle adapter on PostgreSQL, Neon and MySQL servers
        run:
          pnpm exec vp run --cache --filter "@better-apps/database-drizzle^..." build && pnpm --filter
          @better-apps/database-drizzle test:servers
